<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      lang="ru">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Лабораторная работа №2</title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>
<h:body>
    <div class="container">
        <header id="main-header">
            <h1>Лабораторная работа №3</h1>
            <div class="student-info">
                <span class="fio">Кабиров Данияр Умарович</span>
                <span class="group">Группа: P3223</span>
                <span class="variant">Вариант: 4001</span>
            </div>
        </header>

        <div class="input-section">
            <h:form id="pointForm">

                <div class="form-row-horizontal">

                    <div class="x-row">
                        <label for="xInput">X:</label>

                        <p:inputText id="xInput"
                                     value="#{pointBean.xRaw}"
                                     oninput="updateXFromInput()"
                                     style="width:60px;"/>

                        <h:inputHidden id="hiddenX" value="#{pointBean.sliderPercent}"/>

                        <p:slider id="xSlider"
                                  widgetVar="xSliderWidget"
                                  for="hiddenX"
                                  min="0"
                                  max="100"
                                  step="1"
                                  onSlide="adjustSliderValue()"
                                  displayValue="false"
                                  style="width:150px;"/>
                    </div>


                    <div class="y-row">
                        <label for="y">Y:</label>
                        <p:inputText id="y"
                                     value="#{pointBean.y}"
                                     required="true"
                                     validatorMessage="Y должно быть числом от -5 до 5"
                                     style="width:60px;"/>
                        <p:message for="y" display="text"/>
                    </div>


                    <div class="r-row">
                        <label>R:</label>

                        <div style="display:flex; gap:12px;">
                            <h:selectBooleanCheckbox id="r1" value="#{pointBean.r1Selected}" onclick="updateR(this, 1.0)"/>
                            <label for="r1">1</label>

                            <h:selectBooleanCheckbox id="r15" value="#{pointBean.r15Selected}" onclick="updateR(this, 1.5)"/>
                            <label for="r15">1.5</label>

                            <h:selectBooleanCheckbox id="r2" value="#{pointBean.r2Selected}" onclick="updateR(this, 2.0)"/>
                            <label for="r2">2</label>

                            <h:selectBooleanCheckbox id="r25" value="#{pointBean.r25Selected}" onclick="updateR(this, 2.5)"/>
                            <label for="r25">2.5</label>

                            <h:selectBooleanCheckbox id="r3" value="#{pointBean.r3Selected}" onclick="updateR(this, 3.0)"/>
                            <label for="r3">3</label>
                        </div>

                        <h:inputHidden id="r" value="#{pointBean.r}"/>
                    </div>


                    <div class="buttons-row">
                        <p:commandButton id="submitBtn" value="Проверить"
                                         action="#{pointBean.check}"
                                         update="resultsPanel messages"
                                         process="@form"
                                         oncomplete="redrawCurrentGraph()"/>

                        <p:commandButton id="clearBtn" value="Очистить"
                                         action="#{pointBean.clear}"
                                         update="resultsPanel messages"
                                         process="@form"
                                         onclick="return confirm('Очистить все результаты?');"
                                         oncomplete="redrawCurrentGraph()"/>
                    </div>


                    <p:messages id="messages" showDetail="true" closable="true"/>
                </div>
            </h:form>

            <div id="error-banner"></div>
        </div>

        <!-- График -->
        <div class="graph-container">
            <canvas id="areaGraph" width="300" height="300"></canvas>
            <div id="canvasPoint"></div>
        </div>

        <!-- Таблица результатов – центрирована -->
        <div style="margin-top: 30px; display: flex; justify-content: center;">
            <div style="width: 100%; max-width: 900px;">
                <h3 style="text-align: center;">Результаты</h3>

                <h:panelGroup id="resultsPanel" layout="block">
                    <h:dataTable id="resultsTable" class="results-table"
                                 value="#{resultsBean.results}"
                                 var="rec"
                                 style="width:100%; border-collapse: collapse; margin: 0 auto;">
                        <h:column>
                            <f:facet name="header">X</f:facet>
                            #{rec.xPlain}
                        </h:column>
                        <h:column>
                            <f:facet name="header">Y</f:facet>
                            #{rec.yPlain}
                        </h:column>
                        <h:column>
                            <f:facet name="header">R</f:facet>
                            #{rec.r}
                        </h:column>
                        <h:column>
                            <f:facet name="header">Результат</f:facet>
                            <h:outputText value="#{rec.hit ? 'Попадание' : 'Промах'}"
                                          styleClass="#{rec.hit ? 'hit' : 'miss'}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">Время</f:facet>
                            #{rec.formattedTime}
                        </h:column>
                        <h:column>
                            <f:facet name="header">Время работы скрипта</f:facet>
                            #{rec.formattedExec}
                        </h:column>
                    </h:dataTable>
                </h:panelGroup>
            </div>
        </div>

        <br/>
        <div style="text-align: center;">
            <h:outputLink value="#{request.contextPath}/index.xhtml">
                Вернуться к стартовой странице
            </h:outputLink>
        </div>
    </div>

    <h:outputScript library="js" name="script.js"/>
</h:body>
</html>
