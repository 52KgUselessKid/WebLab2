<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      lang="ru">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Старт</title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>
<h:body>
    <div class="container">
        <header id="main-header">
            <h1>Старт</h1>
        </header>

        <h:form id="clockForm">
            <div>
                Текущее время:
                <span id="clientTime"></span>
            </div>
        </h:form>

        <br/>

        <img src="#{request.contextPath}/img/welcome.jpg"
             class="clock-image"/>

        <br/>
        <!-- Самый надёжный способ — обычная ссылка, не commandLink -->
        <h:outputLink value="#{request.contextPath}/main.xhtml">
            Перейти к основной странице приложения
        </h:outputLink>
    </div>

    <h:outputScript library="js" name="script.js"/>

</h:body>
</html>
