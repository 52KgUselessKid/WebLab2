<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      lang="ru">

<ui:composition template="/template.xhtml">

    <ui:define name="title">
        Старт
    </ui:define>

    <ui:define name="content">

        <h:form id="clockForm">
            <div>
                Текущее время:
                <span id="clientTime"></span>
            </div>
        </h:form>

        <br/>

        <img src="#{request.contextPath}/img/welcome.jpg"
             alt="Welcome image"
             class="clock-image"/>

        <br/><br/>

        <div>
            <h:form>
                <h:commandLink value="Перейти к основной странице приложения" action="toMain"/>
            </h:form>
        </div>

    </ui:define>

</ui:composition>
</html>
