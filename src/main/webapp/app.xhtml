<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <meta charset="UTF-8"/>
    <title>Area Check</title>
    <h:outputStylesheet library="css" name="style.css"/>
    <h:outputScript library="js" name="script.js"/>
</h:head>

<h:body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <header id="main-header">
            <h1>Лабораторная работа №2</h1>
            <div class="student-info">
                <span>Кабиров Данияр Умарович</span>
                <span>Группа: P3223</span>
                <span>Вариант: 2555</span>
            </div>
        </header>

        <!-- ===== FORM ===== -->
        <h:form id="pointForm">

            <div class="form-row">

                <!-- X -->
                <label>X:</label>
                <p:selectOneButton value="#{pointBean.x}">
                    <f:selectItems value="#{pointBean.xValues}" var="item" itemValue="#{item}" itemLabel="#{item}"/>
                </p:selectOneButton>

                <!-- Y -->
                <label>Y:</label>
                <p:inputText value="#{pointBean.y}" style="width:70px">
                    <f:validateDoubleRange minimum="-5" maximum="3"/>
                </p:inputText>

                <!-- R -->
                <label>R:</label>
                <p:selectOneRadio value="#{pointBean.r}">
                    <f:selectItems value="#{pointBean.rValues}"/>
                    <p:ajax update="graph"/>
                </p:selectOneRadio>

                <p:commandButton value="Проверить"
                                 action="#{pointBean.submit}"
                                 update="resultsTable graph"
                                 styleClass="ui-button-primary"/>
            </div>

        </h:form>

        <!-- ===== GRAPH ===== -->
        <div class="graph-container">
            <canvas id="areaGraph" width="300" height="300"></canvas>
        </div>

        <!-- ===== RESULTS ===== -->
        <div id="results">
            <h3>Результаты</h3>

            <p:dataTable id="resultsTable"
                         value="#{resultsBean.results}"
                         var="r">

                <p:column headerText="X">#{r.x}</p:column>
                <p:column headerText="Y">#{r.y}</p:column>
                <p:column headerText="R">#{r.r}</p:column>

                <p:column headerText="Результат">
                    <h:outputText value="#{r.hit ? 'Попадание' : 'Промах'}"
                                  styleClass="#{r.hit ? 'hit' : 'miss'}"/>
                </p:column>

                <p:column headerText="Время">
                    #{r.time}
                </p:column>

                <p:column headerText="Время выполнения">
                    #{r.execTime div 1000000} мс
                </p:column>

            </p:dataTable>

        </div>

        <br/>

        <h:link value="Вернуться на стартовую страницу"
                outcome="/index.xhtml"/>

    </div>

</h:body>
</html>
